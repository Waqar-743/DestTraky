[package]
name = "pulsetrack"
version = "1.0.0"
description = "DestTraky — Local-first Windows screen-time & productivity monitor"
authors = ["DestTraky"]
edition = "2021"

[lib]
name = "pulsetrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
pulsetrack-core = { path = "../crates/pulsetrack-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
uuid = { version = "1.11", features = ["v4"] }

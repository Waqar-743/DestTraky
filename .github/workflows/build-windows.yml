name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish installers to (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  test-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Core Tests
        run: cargo test -p pulsetrack-core

  build-windows:
    needs: test-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Build DestTraky Windows NSIS & MSI installers
        run: pnpm tauri build --bundles nsis,msi
      - name: Prepare portable executable
        shell: pwsh
        run: |
          if (Test-Path "target/release/pulsetrack.exe") {
            Copy-Item "target/release/pulsetrack.exe" "target/release/DestTraky_portable_x64.exe" -Force
          }
      - name: Upload Windows installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: desttraky-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/DestTraky_portable_x64.exe
      - name: Publish installers to GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if (-not $tag) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $tag = "${{ github.ref_name }}"
            } else {
              $pkg = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
              $tag = "v$($pkg.version)"
            }
          }

          $files = @()
          $files += Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $files += Get-ChildItem "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if (Test-Path "target/release/DestTraky_portable_x64.exe") {
            $files += (Resolve-Path "target/release/DestTraky_portable_x64.exe").Path
          }

          Write-Host "Publishing to release $tag with files:"
          $files | ForEach-Object { Write-Host " - $_" }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @files --title "DestTraky $tag" --generate-notes --latest
          } else {
            gh release upload $tag @files --clobber
          }
